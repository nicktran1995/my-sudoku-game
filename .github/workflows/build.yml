name: EAS Build (preview)

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build preview (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo auth
        uses: expo/expo-github-action@v8
        with:
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      # iOS tạm bỏ qua (chưa cấu hình credentials). Khi sẵn sàng, đổi --platform thành "all".
      - name: Build preview
        run: npx eas-cli build --platform android --profile preview --non-interactive --no-wait
